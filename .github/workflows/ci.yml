name: Verify TaxAura
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taxaura_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/taxaura_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/taxaura_test
      CHROMA_MODE: disabled
      DOCUMENT_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.14"
      - run: uv sync --frozen --dev
      - run: uv run ruff check src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET_KEY: ci-only-compose-secret-not-for-real-deployment-12345
      AI_MODE: extractive
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail http://localhost:10000/ready
      - run: curl --fail http://localhost:8080/
      - name: Verify frontend proxy reaches FastAPI
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/users/me)" = "401"
      - run: docker compose exec -T app .venv/bin/python -m aura.scripts.seed_knowledge
      - name: Verify Chroma has real MiniLM embeddings
        run: >-
          docker compose exec -T app .venv/bin/python -c
          "from aura.services.vector_store import collection; c=collection('rules'); assert c.count()>0; assert c.query(query_texts=['rebate'], n_results=1)['ids'][0]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Create disposable test administrator
        run: >-
          docker compose exec -T app .venv/bin/python -c
          "import asyncio; from aura.scripts.create_admin import create_admin; asyncio.run(create_admin('e2e-admin@example.com', 'CI Admin', 'ci-admin-password-123'))"
      - name: Real browser journey through the complete stack
        run: npm run test:live --prefix frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: ci-admin-password-123
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-stack-browser-results
          path: frontend/test-results
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes
