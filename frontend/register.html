<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — TaxAura</title><link rel="stylesheet" href="/app/css/styles.css">
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/app/"><span class="brand-mark">T</span>TaxAura</a>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">Your private workspace</p><h1>Create your account</h1><p>Start organizing documents and understanding your tax position.</p>
      <div id="form-message" class="form-message" role="alert" hidden></div>
      <form id="register-form" class="form-stack">
        <label>Full name<input id="full-name" name="full_name" type="text" autocomplete="name" minlength="2" maxlength="120" required></label>
        <label>Email<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><small>Use at least 12 characters.</small></label>
        <button class="button button-primary button-full" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already registered? <a href="/app/login.html">Log in</a></p>
    </section>
  </main>
  <script type="module" src="/app/js/auth.js"></script>
</body>
</html>
