<body class="dashboard-page">
  <aside class="sidebar"><a class="brand" href="/app/dashboard.html"><span class="brand-mark">T</span>TaxAura</a><nav class="side-nav"><a class="nav-item" href="/app/dashboard.html">← Back to dashboard</a><span class="nav-item active">Knowledge admin</span></nav><button id="logout-button" class="nav-item logout-button">Log out</button></aside>
  <main class="dashboard-main"><header class="dashboard-header"><div><p class="eyebrow">Administrator</p><h1>Verified tax knowledge</h1></div></header><div id="global-message" class="form-message" role="alert" hidden></div><section class="dashboard-section active-section"><div class="content-grid"><form id="rule-form" class="panel form-stack"><label>Source name<input id="source-name" type="text" minlength="2" maxlength="255" required></label><label>Official source URL<input id="source-url" type="url" placeholder="https://www.incometax.gov.in/..."></label><label>Verified source content<textarea id="source-content" rows="14" minlength="50" required></textarea></label><button class="button button-primary" type="submit">Ingest verified rule</button></form><article class="panel"><p class="eyebrow">Important</p><h2>Keep the knowledge base trustworthy</h2><ul class="check-list"><li>Use official government sources.</li><li>Include one coherent topic per ingestion.</li><li>Check the applicable assessment year.</li><li>Never paste user financial data here.</li></ul></article></div></section></main>
  <script type="module" src="/app/js/admin.js"></script>
</body>
