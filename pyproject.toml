[project]
name = "aura"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "achyut", email = "achyutchaudhary47@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.2",
    "pgvector>=0.4.1",
    "pydantic-settings>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.52.4",
]

[project.scripts]
aura = "aura:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
