name: taxaura
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: taxaura
      POSTGRES_USER: taxaura
      # Local-only development password; PostgreSQL is not published to the host.
      POSTGRES_PASSWORD: taxaura_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxaura -d taxaura"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://taxaura:taxaura_local@postgres:5432/taxaura}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_MODE: ${AI_MODE:-gemini}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a random JWT_SECRET_KEY in .env first}
      ENVIRONMENT: production
      ALLOWED_HOSTS: localhost,127.0.0.1,app
      ALLOWED_ORIGINS: ""
      DOCUMENT_WORKER_ENABLED: "true"
      PORT: "10000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      API_ORIGIN: http://app:10000
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
