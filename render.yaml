# App-only option. Chroma and PostgreSQL must already exist elsewhere.
# Render Free cannot provide persistent volumes for this Compose stack.
services:
  - type: web
    name: taxaura
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: CHROMA_MODE
        value: http
      - key: CHROMA_HOST
        sync: false
      - key: CHROMA_PORT
        value: "8000"
      - key: CHROMA_SSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_MODE
        value: gemini
      - key: DOCUMENT_WORKER_ENABLED
        value: "true"
