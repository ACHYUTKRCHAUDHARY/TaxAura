services:
  - type: web
    name: taxaura
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: CHROMA_MODE
        value: cloud
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: AI_MODE
        value: extractive
      - key: DOCUMENT_WORKER_ENABLED
        value: "true"
      - key: MAX_DOCUMENTS_PER_USER
        value: "50"
