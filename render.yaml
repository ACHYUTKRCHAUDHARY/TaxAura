# FastAPI only. DATABASE_URL must point to PostgreSQL with the vector extension.
services:
  - type: web
    name: taxaura
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AI_MODE
        value: gemini
      - key: DOCUMENT_WORKER_ENABLED
        value: "true"
